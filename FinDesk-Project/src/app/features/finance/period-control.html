<section
  aria-label="Período consultado"
  class="period-control"
  [style.--active-index]="activeIndex()"
>
  <div
    role="group"
    aria-label="Modo do período"
    class="period-modes"
    (keydown)="moveFocus($event)"
    tabindex="-1"
  >
    @for (item of modes; track item.mode) {
      <span class="mode-option">
        <button
          type="button"
          class="mode-button"
          [attr.aria-label]="item.label"
          [attr.aria-pressed]="context.periodMode() === item.mode"
          [attr.aria-disabled]="!!context.periodUnavailableReason(item.mode)"
          [attr.aria-describedby]="'period-help-' + item.mode"
          aria-controls="finance-period-panel"
          (click)="selectMode(item.mode)"
        >
          @if (item.mode === 'salary-cycle') {
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="11" cy="3" r="2" />
              <path
                d="M11 5v3m-1.5-1.5L11 8l1.5-1.5M9 10h4M5 12c1-2 3-3 6-3h3l3-2v4l2 2h2v5h-3l-1 3h-3l-.5-2h-5L8 21H5l-1-4c-2-1-2-3-1-4M3 13c-2 0-2-2-1-2"
              />
              <circle cx="16" cy="13" r=".7" fill="currentColor" stroke="none" />
            </svg>
          } @else {
            <i [class]="'pi ' + item.icon" aria-hidden="true"></i>
          }
        </button>
        <span role="tooltip" class="mode-help" [id]="'period-help-' + item.mode">{{
          context.periodUnavailableReason(item.mode) ?? item.label
        }}</span>
      </span>
    }
  </div>
  <div
    class="period-expander"
    [class.expanded]="expanded()"
    [class.calendar-expander]="context.periodMode() === 'calendar-month'"
  >
    <button
      #expansionToggle
      type="button"
      class="expansion-toggle"
      [attr.aria-label]="expansionLabel()"
      [attr.aria-expanded]="expanded()"
      [attr.aria-description]="periodTitle()"
      aria-controls="finance-period-panel"
      (click)="toggleExpansion()"
    >
      <i
        [class]="'pi ' + (expanded() ? 'pi-chevron-left' : 'pi-chevron-right')"
        aria-hidden="true"
      ></i>
    </button>
    <div
      id="finance-period-panel"
      class="period-panel"
      tabindex="-1"
      [class.calendar-panel]="context.periodMode() === 'calendar-month'"
      [attr.data-mode]="context.periodMode()"
      [attr.aria-hidden]="!expanded()"
      [inert]="!expanded()"
      [attr.aria-description]="rangeDescription()"
      aria-live="polite"
      (keydown.escape)="closeExpansion($event)"
    >
      <button
        type="button"
        class="period-arrow"
        [attr.aria-label]="navigationLabel(-1)"
        [disabled]="!context.canMovePeriod(-1)"
        (click)="context.movePeriod(-1)"
      >
        <i class="pi pi-chevron-left" aria-hidden="true"></i>
      </button>
      <div class="period-description">
        <p class="period-title">{{ periodTitle() }}</p>
      </div>
      <button
        type="button"
        class="period-arrow"
        [attr.aria-label]="navigationLabel(1)"
        [disabled]="!context.canMovePeriod(1)"
        (click)="context.movePeriod(1)"
      >
        <i class="pi pi-chevron-right" aria-hidden="true"></i>
      </button>
    </div>
  </div>
</section>
